name: StarshipPad iOS build

# ROM-free proof for the sole project repository. Upstream source trees are
# pinned build inputs; this workflow never publishes to them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOYMENT_TARGET: "16.0"

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tracked assets, history, scripts, patches, and docs
        run: scripts/check-repo-safety.sh

  ios-build:
    name: Full app (unsigned iPhoneOS)
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host archive-build dependencies
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libzip
          tinyxml2 libogg libvorbis

      - name: Cache host and iOS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build-host/_deps
            build-ios/_deps
          key: starshippad-ios-${{ runner.os }}-${{ hashFiles('patches/**', 'scripts/*.sh') }}

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: scripts/build-ios.sh --device

      - name: Audit unsigned package and signing gate
        run: |
          scripts/package-ios.sh
          if REQUIRE_SIGNED=1 scripts/package-ios.sh; then
            echo "Unsigned CI app unexpectedly passed REQUIRE_SIGNED=1" >&2
            exit 1
          fi
