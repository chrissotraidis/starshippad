<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StarshipPad iPad touch flight deck</title>
  <desc id="desc">A landscape iPad diagram showing StarshipPad's low-grip analog stick, D-pad, bank buttons, fire and bomb buttons, C-button action diamond, pause, and persistent menu.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#15102c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="stick" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#55b5ff"/>
      <stop offset="1" stop-color="#2076c7"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      .label { fill:#eaf4ff; font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:2px }
      .micro { fill:#91a8c5; font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:1.5px }
      .buttonText { fill:#fff; font:800 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
      .action { fill:#b7c9df; font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:1px }
      .outline { stroke:#fff; stroke-opacity:.55; stroke-width:3 }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#030711"/>
  <circle cx="118" cy="112" r="2" fill="#66d9ff"/><circle cx="232" cy="64" r="1.5" fill="#fff"/>
  <circle cx="418" cy="121" r="2" fill="#7b86ff"/><circle cx="780" cy="56" r="1.5" fill="#fff"/>
  <circle cx="1016" cy="112" r="2" fill="#66d9ff"/><circle cx="1322" cy="63" r="1.5" fill="#fff"/>
  <circle cx="1491" cy="138" r="2" fill="#7b86ff"/>

  <text x="800" y="44" text-anchor="middle" class="micro" fill="#66d9ff">STARSHIPPAD · IPAD FLIGHT DECK</text>

  <g filter="url(#shadow)">
    <rect x="42" y="82" width="1516" height="742" rx="58" fill="#11151d" stroke="#394252" stroke-width="4"/>
    <rect x="72" y="112" width="1456" height="682" rx="34" fill="url(#space)"/>
    <rect x="72" y="112" width="1456" height="682" rx="34" fill="url(#glass)"/>
  </g>

  <g opacity=".7">
    <path d="M470 272h660" stroke="#5cc8ff" stroke-width="1" stroke-dasharray="5 12"/>
    <path d="M530 320h540" stroke="#7886ff" stroke-width="1" stroke-dasharray="3 14"/>
    <path d="M800 254v290" stroke="#5cc8ff" stroke-width="1" stroke-dasharray="5 12"/>
  </g>

  <g text-anchor="middle">
    <text x="800" y="375" class="label">AIM-FIRST</text>
    <text x="800" y="409" class="micro">TWO THUMBS · CLEAR CENTER · ANALOG PRECISION</text>
    <text x="800" y="452" class="micro" fill="#66d9ff">HARKINIANPAD MECHANISM · STAR FOX BINDINGS</text>
  </g>

  <!-- Left grip -->
  <g>
    <rect x="112" y="330" width="150" height="62" rx="31" fill="#111923" class="outline"/>
    <text x="187" y="369" text-anchor="middle" class="buttonText">Z</text>
    <text x="187" y="416" text-anchor="middle" class="action">BANK LEFT · DOUBLE-TAP ROLL</text>

    <g transform="translate(190 548)">
      <circle cx="0" cy="-57" r="27" fill="#15202c" class="outline"/>
      <circle cx="0" cy="57" r="27" fill="#15202c" class="outline"/>
      <circle cx="-57" cy="0" r="27" fill="#15202c" class="outline"/>
      <circle cx="57" cy="0" r="27" fill="#15202c" class="outline"/>
      <text x="0" y="-49" text-anchor="middle" class="buttonText">▲</text>
      <text x="0" y="66" text-anchor="middle" class="buttonText">▼</text>
      <text x="-57" y="8" text-anchor="middle" class="buttonText">◀</text>
      <text x="57" y="8" text-anchor="middle" class="buttonText">▶</text>
    </g>
    <text x="190" y="643" text-anchor="middle" class="action">D-PAD</text>

    <circle cx="402" cy="661" r="103" fill="#02060c" fill-opacity=".58" class="outline"/>
    <circle cx="418" cy="645" r="46" fill="url(#stick)" stroke="#d7efff" stroke-opacity=".72" stroke-width="3"/>
    <text x="402" y="789" text-anchor="middle" class="action">ANALOG FLIGHT STICK</text>
  </g>

  <!-- Right grip -->
  <g>
    <rect x="1338" y="330" width="150" height="62" rx="31" fill="#111923" class="outline"/>
    <text x="1413" y="369" text-anchor="middle" class="buttonText">R</text>
    <text x="1413" y="416" text-anchor="middle" class="action">BANK RIGHT · DOUBLE-TAP ROLL</text>

    <circle cx="1268" cy="361" r="31" fill="#a61f2a" fill-opacity=".72" class="outline"/>
    <text x="1268" y="370" text-anchor="middle" class="buttonText">▶</text>
    <text x="1268" y="416" text-anchor="middle" class="action">PAUSE</text>

    <circle cx="1238" cy="536" r="39" fill="#1670d9" fill-opacity=".76" class="outline"/>
    <text x="1238" y="545" text-anchor="middle" class="buttonText">A</text>
    <text x="1238" y="595" text-anchor="middle" class="action">FIRE / CHARGE</text>
    <circle cx="1154" cy="502" r="35" fill="#138c45" fill-opacity=".76" class="outline"/>
    <text x="1154" y="511" text-anchor="middle" class="buttonText">B</text>
    <text x="1132" y="456" text-anchor="middle" class="action">BOMB</text>
    <circle cx="1238" cy="452" r="35" fill="#111923" class="outline"/>
    <text x="1238" y="461" text-anchor="middle" class="buttonText">Z</text>

    <g transform="translate(1372 666)">
      <circle cx="0" cy="-52" r="29" fill="#d99b17" fill-opacity=".8" class="outline"/>
      <circle cx="0" cy="52" r="29" fill="#d99b17" fill-opacity=".8" class="outline"/>
      <circle cx="-52" cy="0" r="29" fill="#d99b17" fill-opacity=".8" class="outline"/>
      <circle cx="52" cy="0" r="29" fill="#d99b17" fill-opacity=".8" class="outline"/>
      <text x="0" y="-43" text-anchor="middle" class="buttonText">▲</text>
      <text x="0" y="61" text-anchor="middle" class="buttonText">▼</text>
      <text x="-52" y="9" text-anchor="middle" class="buttonText">◀</text>
      <text x="52" y="9" text-anchor="middle" class="buttonText">▶</text>
      <text x="0" y="-95" text-anchor="middle" class="action">VIEW</text>
      <text x="0" y="104" text-anchor="middle" class="action">BRAKE</text>
      <text x="-108" y="6" text-anchor="middle" class="action">BOOST</text>
      <text x="108" y="6" text-anchor="middle" class="action">TALK</text>
    </g>
  </g>

  <g transform="translate(1470 160)">
    <circle r="26" fill="#05090f" fill-opacity=".78" class="outline"/>
    <text x="0" y="8" text-anchor="middle" class="buttonText">•••</text>
    <text x="-48" y="6" text-anchor="end" class="action">MENU</text>
  </g>

  <rect x="650" y="768" width="300" height="7" rx="4" fill="#fff" fill-opacity=".42"/>
</svg>
